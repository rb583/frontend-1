<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact · Rashid Busazi</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">RB<span class="dot">.</span></a>
    <ul class="nav-links">
      <li><a href="index.html"    >Home</a></li>
      <li><a href="profile.html"  >Profile</a></li>
      <li><a href="skills.html"   >Skills</a></li>
      <li><a href="projects.html" >Projects</a></li>
      <li><a href="contact.html"  class="active">Contact</a></li>
    </ul>
    <button class="hamburger" onclick="toggleMenu()">☰</button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html"    onclick="closeMenu()">Home</a>
    <a href="profile.html"  onclick="closeMenu()">Profile</a>
    <a href="skills.html"   onclick="closeMenu()">Skills</a>
    <a href="projects.html" onclick="closeMenu()">Projects</a>
    <a href="contact.html"  onclick="closeMenu()">Contact</a>
  </div>

  <main class="page-content">
    <h2 class="page-title">Get In <span class="accent">Touch</span></h2>
    <div class="contact-wrapper">

      <div class="contact-info">
        <p id="contactTagline"><span class="skeleton sk-line sk-full"></span></p>
        <div class="contact-items" id="contactItems">
          <div class="contact-skeleton"></div>
          <div class="contact-skeleton"></div>
          <div class="contact-skeleton"></div>
          <div class="contact-skeleton"></div>
          <div class="contact-skeleton"></div>
        </div>
      </div>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required/>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required/>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Send Message</button>
        <p id="formStatus" class="form-status"></p>
      </form>

    </div>
  </main>

  <footer class="footer">
    <p>&copy; Built by <span class="accent">Rashid Busazi</span> · Hosted on Vercel</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
