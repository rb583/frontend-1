<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    <nav class="sidebar-nav">
      <a href="index.html"    class="sidebar-link"><span class="sidebar-icon">🏠</span> Home</a>
      <a href="profile.html"  class="sidebar-link"><span class="sidebar-icon">👤</span> My Profile</a>
      <a href="skills.html"   class="sidebar-link"><span class="sidebar-icon">⌨️</span> Skills</a>
      <a href="projects.html" class="sidebar-link"><span class="sidebar-icon">🚀</span> Projects</a>
      <a href="contact.html"  class="sidebar-link active"><span class="sidebar-icon">📧</span> Contact</a>
    </nav>
  </div>

  <nav class="nav">
    <a href="index.html" class="nav-logo" id="navLogo">...</a>
    <button class="menu-btn" onclick="openSidebar()">☰</button>
  </nav>

  <main class="page-content">
    <h2 class="page-title">Get In <span class="accent">Touch</span></h2>
    <div class="contact-wrapper">

      <div class="contact-info">
        <p id="contactTagline"><span class="skeleton sk-line sk-full"></span></p>
        <div class="contact-items" id="contactItems">
          <div class="contact-skeleton"></div>
          <div class="contact-skeleton"></div>
          <div class="contact-skeleton"></div>
          <div class="contact-skeleton"></div>
        </div>
      </div>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required/>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required/>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Send Message</button>
        <p id="formStatus" class="form-status"></p>
      </form>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
